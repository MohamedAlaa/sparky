[package]
name = "sparky"
version = "0.2.0"
edition = "2021"
exclude = ["dist/"]

[dependencies]
eframe = "0.31"
egui_extras = { version = "0.31", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

base64 = "0.22"
url = "2.5.8"
